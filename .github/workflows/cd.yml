name: CD Pipeline

on:
  push:
    branches:
      - release  # main 브랜치에 푸시될 때 배포
  workflow_dispatch:  # 수동 트리거 지원

env:
  AWS_REGION: ap-northeast-2  # 서울 리전
  ECR_REPOSITORY: mockops-ecr # ECR 레포지토리 이름
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Docker 이미지 빌드
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # ECR에 푸시
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # 이미지 URI 출력
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: self-hosted  # EC2 self-hosted runner 사용

    env:
      CONTAINER_NAME: mockops-backend
      IMAGE_NAME: ${{ needs.build-and-push.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare and Clean Image Name
        id: clean_image
        run: |
          # 1. 원본 변수 출력 (디버그용)
          echo "Original IMAGE_NAME: '${{ env.IMAGE_NAME }}'"
          
          # 2. IMAGE_NAME에서 모든 공백 문자, 제어 문자 (널 바이트 포함)를 제거합니다.
          #    tr -d '[:space:]\0'를 사용하여 널 바이트까지 명시적으로 제거합니다.
          CLEAN_IMAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr -d '[:cntrl:]')
          
          # 3. 정리된 변수를 다음 스텝에서 사용할 수 있도록 Actions Output에 저장합니다.
          echo "CLEAN_IMAGE_NAME=${CLEAN_IMAGE_NAME}" >> $GITHUB_OUTPUT
          
          # 4. 정리된 변수 출력 (디버그용)
          echo "Cleaned IMAGE_NAME: '${CLEAN_IMAGE_NAME}'"

      - name: Pull latest image from ECR
        run: |
          echo "📦 Pulling latest image from ECR..."
          docker pull "${{ steps.clean_image.outputs.CLEAN_IMAGE_NAME }}"

      - name: Stop and remove existing container
        run: |
          if [ $(docker ps -aq -f name=${{ env.CONTAINER_NAME }}) ]; then
            echo "🛑 Stopping existing container..."
            docker stop ${{ env.CONTAINER_NAME }}
            echo "🗑️ Removing existing container..."
            docker rm ${{ env.CONTAINER_NAME }}
          else
            echo "ℹ️ No existing container found."
          fi

      - name: Run new container
        run: |
          echo "🚀 Starting new container..."
          CLEAN_IMAGE_NAME="${{ steps.clean_image.outputs.CLEAN_IMAGE_NAME }}"
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            --restart unless-stopped \
            --network app_prod_network \
            -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SERVER_PORT="${{ secrets.SERVER_PORT }}" \
            -e SSL_ENABLED="${{ secrets.SSL_ENABLED }}" \
            -e DB_URL="${{ secrets.DB_URL }}" \
            -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -e REDIS_HOST="${{ secrets.REDIS_HOST }}" \
            -e REDIS_PORT="${{ secrets.REDIS_PORT }}" \
            -e REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
            -e OAUTH_GOOGLE_CLIENT_ID="${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}" \
            -e OAUTH_GOOGLE_CLIENT_SECRET="${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}" \
            -e OAUTH_GITHUB_CLIENT_ID="${{ secrets.OAUTH_GITHUB_CLIENT_ID }}" \
            -e OAUTH_GITHUB_CLIENT_SECRET="${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -e BASE_URL="${{ secrets.BASE_URL }}" \
            -e OAUTH2_REDIRECT_URL="${{ secrets.OAUTH2_REDIRECT_URL }}" \
            -e OAUTH2_ERROR_REDIRECT_URL="${{ secrets.OAUTH2_ERROR_REDIRECT_URL }}" \
            -e OAUTH2_CONSENT_REQUIRED_URL="${{ secrets.OAUTH2_CONSENT_REQUIRED_URL }}" \
            -e APP_FRONTEND_URL="${{ secrets.APP_FRONTEND_URL }}" \
            -e CORS_ALLOWED_ORIGINS="${{ secrets.CORS_ALLOWED_ORIGINS }}" \
            -e MAIL_HOST="${{ secrets.MAIL_HOST }}" \
            -e MAIL_PORT="${{ secrets.MAIL_PORT }}" \
            -e MAIL_USERNAME="${{ secrets.MAIL_USERNAME }}" \
            -e MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}" \
            -e LEGAL_TOS_VERSION="${{ secrets.LEGAL_TOS_VERSION }}" \
            -e LEGAL_PP_VERSION="${{ secrets.LEGAL_PP_VERSION }}" \
            -e LOG_FILE_PATH=/var/log/mockops/application.log \
            -v /var/log/mockops:/var/log/mockops \
            "$CLEAN_IMAGE_NAME"

      - name: Clean up unused images
        run: |
          echo "🧹 Cleaning up unused images..."
          docker image prune -f

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."

          # 헬스체크 (최대 10번 시도, 30초 간격)
          for i in {1..10}; do
            if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "✅ Deployment successful! Application is healthy."
              exit 0
            fi
            echo "⏳ Waiting for application to be ready... (attempt $i/10)"
            sleep 30
          done

          echo "❌ Deployment verification failed. Application is not responding."
          exit 1

  generate_release_notes:
    name: Generate RELEASES.md
    runs-on: ubuntu-latest
    needs: deploy

    permissions:
      contents: write

    steps:
      - name: Checkout repository (Full history for comparison)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 Git 히스토리가 필요
          token: ${{ secrets.GITHUB_TOKEN }} # 기본 토큰 사용

      - name: Configure Git for CI Bot
        run: |
            git config --global user.name "CI/CD Release Bot"
            git config --global user.email "ci-bot@users.noreply.github.com"

      - name: Run Release Notes Generation Script
        run: |
          echo "🚀 Starting Release Note Generation..."
          
          # ----------------------------------------------------
          # 1. 릴리즈 노트 생성에 필요한 환경 변수 설정
          # ----------------------------------------------------
          # 마지막 태그를 찾아 커밋 비교의 기준점으로 사용
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
              LAST_TAG=$(git rev-list --max-parents=0 HEAD)
              echo "No tags found. Starting from the initial commit: $LAST_TAG"
          else
              echo "Last release tag found: $LAST_TAG"
          fi
          
          RELEASE_DATE=$(date "+%Y-%m-%d %H:%M:%S")
          RELEASE_VERSION="Release $(date "+%Y%m%d.%H%M")"
          
          # ----------------------------------------------------
          # 2. 커밋 로그에서 PR 병합 기록 추출
          # ----------------------------------------------------
          # --merges와 grep을 사용하여 PR 병합 커밋만 필터링
          RELEASE_CHANGES=$(git log --merges --pretty=format:"* %s" $LAST_TAG..HEAD | grep -E "Merge pull request|Merge branch" | sed 's/Merge pull request #[0-9]* from [^/]*\/\([^:]*\):/\1/g' | sed 's/Merge branch '\''[^'\'']*'\'' into / /g')

          if [ -z "$RELEASE_CHANGES" ]; then
              echo "No new changes since the last tag to record. Exiting Release Note job."
              exit 0
          fi
          
          # ----------------------------------------------------
          # 3. 새로운 릴리즈 노트 콘텐츠 생성
          # ----------------------------------------------------
          RELEASE_NOTE="# ${RELEASE_VERSION}\n"
          RELEASE_NOTE+="\n**릴리즈 날짜:** ${RELEASE_DATE}\n"
          RELEASE_NOTE+="\n**변경 사항:**\n"
          RELEASE_NOTE+="${RELEASE_CHANGES}\n"
          
          # ----------------------------------------------------
          # 4. RELEASES.md 파일 업데이트 및 커밋/푸시
          # ----------------------------------------------------
          HISTORY_FILE="RELEASES.md"
          
          # 새 콘텐츠를 임시 파일에 작성
          echo -e "$RELEASE_NOTE" > temp_release_note.md
          
          # 기존 파일 내용을 새 노트 아래에 추가 (파일이 있다면)
          if [ -f "$HISTORY_FILE" ]; then
              cat "$HISTORY_FILE" >> temp_release_note.md
          fi
          
          # 임시 파일을 최종 파일로 덮어쓰기
          mv temp_release_note.md "$HISTORY_FILE"
          
          # 파일 변경 사항 커밋
          git add "$HISTORY_FILE"
          
          # 변경 사항이 있는지 확인 후 커밋 (CI/CD가 무한 루프에 빠지는 것을 방지)
          if git diff --cached --exit-code; then
              echo "No actual changes in RELEASES.md to commit. Nothing to push."
          else
              # [skip ci] 태그를 사용하여 이 커밋이 다시 워크플로우를 트리거하지 않도록 방지
              git commit -m "docs(release): Add release notes for ${RELEASE_VERSION} [skip ci]"
              git push origin HEAD:$GITHUB_REF_NAME
              echo "✅ Successfully updated and pushed ${HISTORY_FILE}."
          fi
