server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: ${SSL_ENABLED:false}  # 프로덕션에서는 HTTPS 사용

  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        same-site: none
        secure: true
        domain: mockops.cloud

spring:
  # 데이터베이스 설정 (프로덕션 - 환경변수)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}  # 예: jdbc:mysql://db.example.com:3306/mockops_prod?useSSL=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: validate  # 프로덕션에서는 validate만 사용 (스키마 자동 변경 금지)
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: false

  # Redis 설정 (프로덕션 - 환경변수)
  data:
    redis:
      host: ${REDIS_HOST}  # 예: redis.example.com
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # OAuth2 설정 (프로덕션 - 환경변수)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET}
            redirect-uri: ${BASE_URL}/login/oauth2/code/google
            scope:
              - email
              - profile
          github:
            client-id: ${OAUTH_GITHUB_CLIENT_ID}
            client-secret: ${OAUTH_GITHUB_CLIENT_SECRET}
            redirect-uri: ${BASE_URL}/login/oauth2/code/github
            scope:
              - user:email
              - read:user

  # 메일 설정 (프로덕션 - 환경변수)
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}  # Gmail 앱 비밀번호
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# JWT Secret Key (프로덕션 - 환경변수, 최소 256비트 이상 필수)
jwt:
  secret: ${JWT_SECRET}

# OAuth2 리다이렉트 URL (프로덕션 - 환경변수)
oauth2:
  redirect-url: ${OAUTH2_REDIRECT_URL}
  error-redirect-url: ${OAUTH2_ERROR_REDIRECT_URL}
  consent-required-url: ${OAUTH2_CONSENT_REQUIRED_URL}

# Frontend URL (프로덕션 - 환경변수)
app:
  frontend-url: ${APP_FRONTEND_URL}

# CORS 설정 (프로덕션 - 환경변수, 쉼표로 구분)
# 예: CORS_ALLOWED_ORIGINS=https://mockops.com,https://www.mockops.com
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# 로깅 레벨 (프로덕션)
logging:
  level:
    root: WARN
    com.mockops: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  file:
    name: ${LOG_FILE_PATH:/var/log/mockops/application.log}
    max-size: 10MB
    max-history: 30

# 약관 버전 관리
legal:
  agreements:
    tos-version: ${LEGAL_TOS_VERSION}
    pp-version: ${LEGAL_PP_VERSION}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    # 메일 서버 헬스 체크 비활성화
    mail:
      enabled: false
