server:
  port: ${SERVER_PORT:8080}

spring:
  # 데이터베이스 설정 (프로덕션 - 환경변수)
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: validate  # 프로덕션에서는 validate만 사용
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Redis 설정 (프로덕션 - 환경변수)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # OAuth2 설정 (프로덕션 - 환경변수)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET}
            redirect-uri: ${BASE_URL}/login/oauth2/code/google
            scope:
              - email
              - profile
          github:
            client-id: ${OAUTH_GITHUB_CLIENT_ID}
            client-secret: ${OAUTH_GITHUB_CLIENT_SECRET}
            redirect-uri: ${BASE_URL}/login/oauth2/code/github
            scope:
              - user:email
              - read:user

  # 메일 설정 (프로덕션 - 환경변수)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT Secret Key (프로덕션 - 환경변수)
jwt:
  secret: ${JWT_SECRET}

# CORS 설정 (프로덕션 - 환경변수, 쉼표로 구분)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://mockops.com}

# 로깅 레벨 (프로덕션)
logging:
  level:
    root: WARN
    com.mockops: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  file:
    name: ${LOG_FILE_PATH:/var/log/mockops/application.log}
    max-size: 10MB
    max-history: 30
