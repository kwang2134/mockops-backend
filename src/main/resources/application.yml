spring:
  application:
    name: MockOps-Backend

  # 활성 프로필 설정 (local 또는 prod)
  profiles:
    active: local

  # JPA 공통 설정
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100

# 로깅 공통 설정
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  level:
    root: INFO
    com.mockops: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# JWT 공통 설정 (토큰 만료 시간)
jwt:
  access-token-expiration: 30m # 30분
  refresh-token-expiration: 14d  # 2주
  invitation-token-expiration: 7d # 7일

# OAuth2 공통 설정
oauth2:
  redirect-url: http://localhost:3000/oauth2/callback
  error-redirect-url: http://localhost:3000/oauth2/error

# Redis 공통 설정
spring.data.redis:
  host: localhost
  port: 6379
  password: # 로컬 환경에서는 비밀번호 없음 (빈 문자열)
  timeout: 3000ms
  lettuce:
    pool:
      max-active: 8
      max-idle: 8
      min-idle: 2

# 애플리케이션 설정
app:
  frontend-url: http://localhost:3000
