spring:
  application:
    name: MockOps-Backend

  # 활성 프로필 설정
  profiles:
    active: local

  # 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: 5MB       # 단일 파일 최대 크기
      max-request-size: 5MB    # 전체 요청 최대 크기
      enabled: true

  # JPA 공통 설정
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100

# 로깅 공통 설정
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  level:
    root: INFO
    com.mockops: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# JWT 토큰 만료 시간 (공통)
jwt:
  access-token-expiration: 30m    # Access Token: 30분
  refresh-token-expiration: 14d   # Refresh Token: 2주
  invitation-token-expiration: 7d # 초대 토큰: 7일
  webhook-token-expiration: 30d   # Webhook 토큰: 30일

# OAuth2 리다이렉트 URL (공통 기본값)
oauth2:
  redirect-url: http://localhost:3000/oauth2/callback
  error-redirect-url: http://localhost:3000/oauth2/error

# Frontend URL (공통 기본값)
app:
  frontend-url: http://localhost:3000

# Redis 공통 설정
spring.data.redis:
  timeout: 3000ms
  lettuce:
    pool:
      max-active: 8
      max-idle: 8
      min-idle: 2
